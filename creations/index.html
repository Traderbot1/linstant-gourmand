<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.classList.add('js')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4c1212" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <title>Nos créations — L’instant Gourmand</title>
    <meta name="description" content="Les créations de L’instant Gourmand : gâteaux, trompe-l’œil, douceurs tunisiennes, coffrets, salé et jus. Pâtisserie sur commande à La Garenne-Colombes." />
    <link rel="canonical" href="https://linstantg.com/creations/" />
    <meta property="og:title" content="Nos créations — L’instant Gourmand" />
  </head>
  <body data-page="creations">
    <!--@header-->
    <main id="main">
      <section class="page-hero" data-header-theme="dark">
        <div class="page-hero__mono" aria-hidden="true"><!--@monogram--></div>
        <div class="wrap" style="position: relative">
          <p class="eyebrow">La galerie</p>
          <h1 class="display h1" data-split>Nos créations</h1>
          <p class="lead reveal-up">Chaque pièce est unique, imaginée pour une personne, une date, une émotion. Choisissez une section, laissez-vous inspirer, puis créons la vôtre.</p>
        </div>
      </section>

      <section class="section" data-header-theme="light">
        <div class="wrap">
          <div class="cats"><!--@homeCats--></div>
        </div>
      </section>

      <section class="section section--dark cta" data-header-theme="dark">
        <div class="wrap">
          <p class="eyebrow" style="color: var(--nude)">Sur mesure</p>
          <h2 class="display h2" data-split>Vous avez une idée&nbsp;? <span class="script">Racontez-la nous.</span></h2>
          <div class="cta__ctas"><a class="btn btn--light" href="/commander/" data-magnetic>Demander un devis <svg class="btn__arrow" viewBox="0 0 16 10" fill="none" stroke="currentColor" aria-hidden="true"><path d="M0 5h15M11 1l4 4-4 4"/></svg></a></div>
        </div>
      </section>
    </main>
    <!--@footer-->
    <script type="module" src="/src/js/page.js"></script>
  </body>
</html>
